name: youthcapital

services:
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    # Cache and shared rate limits only; recomputation stays synchronous.
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 192mb, --maxmemory-policy, noeviction]
    networks: [backendnet]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

networks:
  backendnet:
  frontendnet:
  database:
    external: true
    name: ${DB_NETWORK:?DB_NETWORK must identify the existing shared database network}
  edge:
    name: youthcapital_edge
