name: infra checks

on:
  push:
    branches: [main]
    paths-ignore:
      - apps/backend/image.env
      - apps/frontend/image.env
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Test release guards and secret transport
        run: node --test tests/runtime.test.mjs
      - name: Check and exercise shell scripts
        run: |
          for file in scripts/*.sh tests/*.sh; do bash -n "$file"; done
          bash tests/deploy.test.sh
      - name: Validate independent Compose models
        run: node --test tests/compose.test.mjs
      - name: Validate Caddy configuration
        run: |
          docker run --rm -e DOMAIN=example.test -e ACME_EMAIL=operations@example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify signed-download log redaction
        run: node --test tests/caddy.test.mjs
      - name: Verify Cloudflare proxy trust and forged-header rejection
        run: node --test tests/proxy.test.mjs
      - name: Verify proxied and direct bootstrap DNS
        run: node --test tests/bootstrap.test.mjs
